seed: 42
val_ratio: 0.1
max_samples_per_dataset: null  # e.g. 5000 for quick experiments

paths:
  mvtec_root: /home/ljh/mvtecAD
  visa_root: /home/ljh/VisA

allowed_categories:
  mvtec:
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper
  visa:
    - candle
    - capsules
    - cashew
    - chewinggum
    - fryum
    - macaroni1
    - macaroni2
    - pcb1
    - pcb2
    - pcb3
    - pcb4
    - pipe_fryum

output:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  stats_json: data/processed/stats.json

question_templates:
  abnormal:
    - 图中是否存在异常？
    - 该图像是正常样本还是异常样本？
  defect_type:
    - 请判断该图像的缺陷类型。
  location:
    - 缺陷主要位于图像哪个区域？
  rationale:
    - 请简要说明你的判断依据。
